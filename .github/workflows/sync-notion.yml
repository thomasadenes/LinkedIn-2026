name: Synchronisation Notion
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
concurrency:
  group: notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Récupérer les données Notion et les chiffrer
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/sync-notion.mjs
      - name: Sauvegarder uniquement les données chiffrées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualisation des KPI Notion chiffrés"
            git push
          fi
